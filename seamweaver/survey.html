<style>
  html, body { overflow: auto; height: auto; }
  body { background: var(--bg); }
  .top { position: sticky; top: 0; z-index: 2; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .top b { font-size: 14px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px 80px; }
  h1 { font-size: 22px; margin: 6px 0 6px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-top: 16px; }
  section > p.dim { margin: 0 0 14px; font-size: 12.5px; line-height: 1.6; }
  .q { padding: 12px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; }
  .q > label, .q > .lab { display: block; margin-bottom: 8px; line-height: 1.55; }
  .q .num { color: var(--accent); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
  textarea, input[type=text], input[type=number], select { width: 100%; background: #16171b; border: 1px solid var(--line2); border-radius: 8px; color: var(--text); padding: 8px 10px; font: inherit; }
  textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
  textarea:focus, input:focus, select:focus { outline: 2px solid rgba(240,164,60,.5); outline-offset: 0; border-color: transparent; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line2); border-radius: 8px; cursor: pointer; background: var(--panel2); }
  .opts input { accent-color: var(--accent); margin: 0; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .scale .opts label { width: 34px; justify-content: center; padding: 5px 0; }
  .scale .opts label:has(input:checked) { background: var(--accent); color: #1b1405; border-color: transparent; font-weight: 600; }
  .scale .opts input { display: none; }
  .task { background: #191a1e; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .task h3 { margin: 0 0 4px; font-size: 13.5px; }
  .task p { margin: 0 0 10px; color: #cfd3da; line-height: 1.6; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .warn { color: var(--accent); }
  #done { margin-top: 12px; line-height: 1.6; }
</style>
</head>

    el('section', {}, el('h2', { text: t.susH }), el('p', { class: 'dim', text: t.susP }), t.sus.map((s, i) => q('S' + (i + 1), s, scale('sus' + (i + 1), 5, '1', '5')))),
    el('section', {}, el('h2', { text: t.openH }), t.open.map((s, i) => q('F' + (i + 1), s, text('open' + (i + 1))))),
    el('section', {}, el('h2', { text: t.submitH }), el('p', { class: 'dim', text: t.submitP + ' ' + t.logInfo.replace('{n}', nLog) }),
      el('div', { class: 'actions' },
        el('button', { class: 'primary', text: t.dl, onclick: () => { if (!A.consent) { msg.textContent = t.need; return; } download(); msg.textContent = t.done; } }),
        el('button', { text: t.copy, onclick: async () => { if (!A.consent) { msg.textContent = t.need; return; } await navigator.clipboard.writeText(JSON.stringify(payload(false), null, 1)); msg.textContent = t.copied; } }),
        el('span', { class: 'spacer' }),
        el('button', { text: t.clear, onclick: () => { if (confirm(t.sure)) { const c = A.code; A = { code: c, started: new Date().toISOString() }; saveA(); render(); } } })),
      msg));
}
function payload(full = true) {
  let log = [], edits = null; try { log = JSON.parse(localStorage.getItem('seam.log.v1') || '[]'); edits = JSON.parse(localStorage.getItem('seam.edits.v1') || 'null'); } catch {}
  const sus = Array.from({ length: 10 }, (_, i) => A['sus' + (i + 1)]);
  const susScore = sus.every(Number.isFinite) ? sus.reduce((s, v, i) => s + (i % 2 === 0 ? v - 1 : 5 - v), 0) * 2.5 : null;
  return { format: 'seamstation-survey-2', lang, submitted: new Date().toISOString(), answers: A, susScore, userAgent: navigator.userAgent, log: full ? log : `(${log.length})`, edits: full ? edits : (edits ? '(included in file)' : null) };
}
function download() {
  const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(payload())], { type: 'application/json' })), download: `seamstation_${A.code}.json` });
  document.body.append(a); a.click(); a.remove();
}
render();
</script>
