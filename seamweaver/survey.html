  textarea, input[type=text], input[type=number], select { width: 100%; background: #16171b; border: 1px solid var(--line2); border-radius: 8px; color: var(--text); padding: 8px 10px; font: inherit; }

  textarea:focus, input:focus, select:focus { outline: 2px solid rgba(240,164,60,.5); outline-offset: 0; border-color: transparent; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line2); border-radius: 8px; cursor: pointer; background: var(--panel2); }
  .opts input { accent-color: var(--accent); margin: 0; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .scale .opts label { width: 34px; justify-content: center; padding: 5px 0; }
  .scale .opts label:has(input:checked) { background: var(--accent); color: #1b1405; border-color: transparent; font-weight: 600; }
  .scale .opts input { display: none; }
  .task { background: #191a1e; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .task h3 { margin: 0 0 4px; font-size: 13.5px; }
  .task p { margin: 0 0 10px; color: #cfd3da; line-height: 1.6; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .warn { color: var(--accent); }
  #done { margin-top: 12px; line-height: 1.6; }
