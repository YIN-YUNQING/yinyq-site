<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230284c7'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='%23ffffff' font-weight='bold'>Q</text></svg>" />
  <title>SeamWeaver 用户测试问卷 / User Study Questionnaire</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --emerald: #059669;
      --rose: #e11d48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK JP", "Inter", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 65%, #0c4a6e 100%);
      color: #f8fafc;
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7dd3fc;
    }
    .lang-bar {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .lang-bar button {
      border: none;
      background: transparent;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-bar button.active {
      background: #ffffff;
      color: #0f172a;
    }
    .hero h1 {
      margin: 0 0 6px 0;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.3;
    }
    .hero p {
      margin: 0;
      font-size: 13px;
      color: #cbd5e1;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 4px 0;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #0369a1;
    }
    .section-sub {
      margin: 0 0 14px 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .field {
      margin-bottom: 14px;
    }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 13.5px;
      color: #0f172a;
    }
    .req { color: var(--rose); margin-left: 3px; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text);
      background: #ffffff;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    textarea {
      min-height: 76px;
      resize: vertical;
    }
    .check-grid, .radio-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .radio-stack {
      flex-direction: column;
    }
    .opt-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      background: #ffffff;
      transition: all 0.1s ease;
    }
    .opt-pill:hover { border-color: var(--accent); background: #f8fafc; }
    .opt-pill input { accent-color: var(--accent); margin: 0; }

    /* Likert 7-point items */
    .likert-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: #fcfdff;
    }
    .likert-item.missing {
      border-color: var(--rose);
      background: #fff1f2;
    }
    .likert-q {
      font-weight: 600;
      font-size: 13.5px;
      margin-bottom: 10px;
      color: #0f172a;
    }
    .likert-num {
      display: inline-block;
      min-width: 30px;
      font-weight: 800;
      color: var(--accent);
    }
    .likert-row {
      display: grid;
      grid-template-columns: auto repeat(7, 1fr) auto;
      align-items: center;
      gap: 6px;
    }
    .likert-end {
      font-size: 11px;
      color: var(--muted);
      max-width: 82px;
      line-height: 1.25;
    }
    .likert-end.right { text-align: right; }
    .likert-btn {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .likert-btn input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .likert-btn span {
      width: 100%;
      max-width: 44px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      color: #334155;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .likert-btn span:hover {
      border-color: var(--accent);
      background: #f0f9ff;
    }
    .likert-btn input:checked + span {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }

    .consent-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #0c4a6e;
    }
    .consent-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn {
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.12s ease;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      border-color: transparent;
      color: #ffffff;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-green {
      background: var(--emerald);
      border-color: transparent;
      color: #ffffff;
    }
    .toast {
      display: none;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .toast.ok { display: block; background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; }
    .toast.err { display: block; background: #fff1f2; border: 1px solid #fda4af; color: #9f1239; }

    .preview-box {
      display: none;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 220px;
      overflow: auto;
    }

    @media (max-width: 640px) {
      .row-2 { grid-template-columns: 1fr; }
      .likert-row { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .likert-end { grid-column: span 7; max-width: none; }
      .likert-end.right { text-align: right; }
    }

    body.embed-mode {
      padding: 12px 12px 44px;
      font-size: 13px;
      background: #f1f5f9;
    }
    body.embed-mode .container {
      max-width: 100%;
    }
    body.embed-mode .hero {
      padding: 14px 16px;
      margin-bottom: 12px;
      border-radius: 10px;
    }
    body.embed-mode .hero h1 { font-size: 17px; }
    body.embed-mode .hero p { font-size: 12px; }
    body.embed-mode .card {
      padding: 13px 14px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    body.embed-mode .section-title { font-size: 14.5px; }
    body.embed-mode .row-2 { grid-template-columns: 1fr; gap: 10px; }
    body.embed-mode .likert-item { padding: 10px 11px; margin-bottom: 8px; }
    body.embed-mode .likert-q { font-size: 12.8px; margin-bottom: 8px; }
    body.embed-mode .likert-row { grid-template-columns: repeat(7, 1fr); gap: 4px; }
    body.embed-mode .likert-end { grid-column: span 7; max-width: none; font-size: 10.5px; }
    body.embed-mode .likert-end.right { text-align: right; }
    body.embed-mode .likert-btn span { height: 32px; font-size: 12px; }
    body.embed-mode .btn { padding: 8px 12px; font-size: 12.5px; }
  </style>
</head>
<body>
<div class="container">
  <header class="hero">
    <div class="hero-top">
      <div class="kicker">SeamWeaver v0.5 · ACM UIST 2027 User Study</div>
      <div class="lang-bar">
        <button type="button" data-lang="zh" class="active">中文</button>
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <h1 id="t-title"></h1>
    <p id="t-subtitle"></p>
  </header>

  <form id="surveyForm" novalidate>
    <!-- Consent -->
    <div class="card">
      <div class="consent-box">
        <div id="t-consentText"></div>
        <label class="consent-check">
          <input type="checkbox" id="consent" name="consent" required />
          <span id="t-consentAgree"></span>
        </label>
      </div>
    </div>

    <!-- Part A: Background -->
    <div class="card">
      <h2 class="section-title"><span class="section-badge">Part A</span> <span id="t-partA"></span></h2>
      <p class="section-sub" id="t-partASub"></p>

      <div class="row-2">
        <div class="field">
          <label class="field-label" for="pid"><span id="t-pid"></span><span class="req">*</span></label>
          <input type="text" id="pid" name="pid" placeholder="P01" required />
        </div>
        <div class="field">
          <label class="field-label" for="years"><span id="t-years"></span><span class="req">*</span></label>
          <input type="number" id="years" name="years" min="0" max="50" step="0.5" placeholder="3" required />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="role"><span id="t-role"></span><span class="req">*</span></label>
        <input type="text" id="role" name="role" required />
      </div>

      <div class="field">
        <span class="field-label" id="t-daws"></span>
        <div class="check-grid" id="dawGrid"></div>
      </div>

      <div class="row-2">
        <div class="field">
          <label class="field-label" for="middleware"><span id="t-middleware"></span><span class="req">*</span></label>
          <select id="middleware" name="middleware" required></select>
        </div>
        <div class="field">
          <label class="field-label" for="oddMeterExp"><span id="t-oddMeter"></span><span class="req">*</span></label>
          <select id="oddMeterExp" name="oddMeterExp" required></select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="device"><span id="t-device"></span></label>
        <input type="text" id="device" name="device" />
      </div>
    </div>

    <!-- Part B: 10 Likert Questions -->
    <div class="card">
      <h2 class="section-title"><span class="section-badge">Part B</span> <span id="t-partB"></span></h2>
      <p class="section-sub" id="t-partBSub"></p>
      <div id="likertContainer"></div>
    </div>

    <!-- Part C: 3 Aesthetic & Workflow Preference Choices -->
    <div class="card">
      <h2 class="section-title"><span class="section-badge">Part C</span> <span id="t-partC"></span></h2>
      <p class="section-sub" id="t-partCSub"></p>

      <div class="field">
        <span class="field-label"><span id="t-prefA"></span><span class="req">*</span></span>
        <div class="radio-stack" id="prefAGroup"></div>
      </div>
      <div class="field">
        <label class="field-label" for="prefAReason" id="t-prefAReason"></label>
        <input type="text" id="prefAReason" name="prefAReason" />
      </div>

      <div class="field">
        <span class="field-label"><span id="t-prefB"></span><span class="req">*</span></span>
        <div class="radio-stack" id="prefBGroup"></div>
      </div>

      <div class="field">
        <span class="field-label"><span id="t-prefC"></span><span class="req">*</span></span>
        <div class="radio-stack" id="prefCGroup"></div>
      </div>
    </div>

    <!-- Part D: 6 Open-Ended Interview / Feedback Questions -->
    <div class="card">
      <h2 class="section-title"><span class="section-badge">Part D</span> <span id="t-partD"></span></h2>
      <p class="section-sub" id="t-partDSub"></p>
      <div id="openContainer"></div>
    </div>

    <!-- Submit & Export -->
    <div class="submit-panel">
      <div id="toast" class="toast"></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="t-btnDownloadCsv"></button>
        <button type="button" class="btn btn-green" id="btnCopy"></button>
        <button type="button" class="btn" id="btnDownloadJson"></button>
        <button type="button" class="btn" id="btnReset" style="margin-left:auto;"></button>
      </div>
      <div id="t-exportHint" style="font-size:12px; color: var(--muted);"></div>
      <pre id="previewBox" class="preview-box"></pre>
    </div>
  </form>
</div>

<script>
// Optional: if hosted online with a Formspree / Google Apps Script webhook, paste URL here:
const OPTIONAL_WEBHOOK_URL = "";

const I18N = {
  zh: {
    title: "SeamWeaver 多拍号自适应游戏音乐工具 · 测试反馈问卷",

    consentText: "【知情同意说明】本研究面向 ACM UIST 2027 学术投稿，旨在评估交互式多拍号自适应游戏音乐创作工具的可用性与音乐美学权衡。您的回答将以匿名编号（如 P01）保存，绝不公开个人身份信息，您可随时退出测试。",

    role: "当前专业方向 / 身份（如：洗足音大 作曲音响设计研一 / 游戏配乐师）",
    rolePh: "例：作曲音响设计硕士在读 / 影视游戏配乐",
    daws: "平时使用的 DAW / 制谱软件（可多选）",

    oddMeter: "自适应音乐过渡 / 不等分拍号（5/4、8/8 等）写作经验",

      { id: "Q3_hybrid_control", code: "Q3", text: "“仅实时计算开头两音 + 保留作曲家固定模板”的混合方式，让我保有足够的作曲控制权。" },
      { id: "Q4_pin_and_nudge", code: "Q4", text: "在全局规则（如 Minimax）基础上叠加单格手动 Pin 锁定与来源音高微调，非常贴合作曲习惯。" },

      { id: "Q10_adoption", code: "Q10", text: "如果未来支持直接导入我的 DAW 工程并导出到游戏引擎，我愿意在实际作品中使用它。" }

    partC: "三项核心美学与工作流偏好（单选）",

    ],
    prefC: "偏好 C（日常调试首选视图）：日常检查与修改接缝时，您最倾向使用？",
    prefCOpts: [

const STORAGE_KEY = "seamweaver_survey_draft_v1";
let currentLang = "zh";

function saveDraft() {
  const data = collectFormData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ lang: currentLang, data }));
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

  setText("t-title", t.title);
  setText("t-subtitle", t.subtitle);

  setText("t-middleware", t.middleware);
  setText("t-oddMeter", t.oddMeter);
  setText("t-device", t.device);
  setText("t-partB", t.partB);
  setText("t-partBSub", t.partBSub);
  setText("t-partC", t.partC);
  setText("t-partCSub", t.partCSub);
  setText("t-prefA", t.prefA);
  setText("t-prefAReason", t.prefAReason);
  setText("t-prefB", t.prefB);
  setText("t-prefC", t.prefC);
  setText("t-partD", t.partD);
  setText("t-partDSub", t.partDSub);
  setText("t-btnDownloadCsv", t.btnDownloadCsv);
  setText("btnCopy", t.btnCopy);
  setText("btnDownloadJson", t.btnDownloadJson);
  setText("btnReset", t.btnReset);
  setText("t-exportHint", t.exportHint);

  document.getElementById("role").placeholder = t.rolePh;
  document.getElementById("device").placeholder = t.devicePh;
  document.getElementById("prefAReason").placeholder = t.prefAReasonPh;

  const snap = restoreData || collectFormData();

  // DAWs
  const dawGrid = document.getElementById("dawGrid");
  dawGrid.innerHTML = DAW_LIST.map((d) => `
    <label class="opt-pill">
      <input type="checkbox" name="daws" value="${d}" ${(snap.daws || []).includes(d) ? "checked" : ""} />
      <span>${d}</span>
    </label>
  `).join("");

  // Selects
  const fillSelect = (id, opts, val) => {
    const sel = document.getElementById(id);
    sel.innerHTML = opts.map((o, idx) => `<option value="${idx === 0 ? "" : idx}" ${String(val) === String(idx) ? "selected" : ""}>${o}</option>`).join("");
  };
  fillSelect("middleware", t.mwOpts, snap.middleware);
  fillSelect("oddMeterExp", t.oddOpts, snap.oddMeterExp);

  // Likert Q1-Q10
  const likertHost = document.getElementById("likertContainer");
  likertHost.innerHTML = t.likert.map((item) => {
    const cur = snap[item.id] || "";
    const btns = [1, 2, 3, 4, 5, 6, 7].map((v) => `
      <label class="likert-btn">
        <input type="radio" name="${item.id}" value="${v}" ${String(cur) === String(v) ? "checked" : ""} required />
        <span>${v}</span>
      </label>
    `).join("");
    return `
      <div class="likert-item" data-qid="${item.id}">
        <div class="likert-q"><span class="likert-num">${item.code}</span>${item.text}<span class="req">*</span></div>
        <div class="likert-row">
          <span class="likert-end">${t.lowEnd}</span>
          ${btns}
          <span class="likert-end right">${t.highEnd}</span>
        </div>
      </div>
    `;
  }).join("");

  // Preferences A/B/C
  const fillRadios = (hostId, name, opts, cur) => {
    document.getElementById(hostId).innerHTML = opts.map((o) => `
      <label class="opt-pill">
        <input type="radio" name="${name}" value="${o.v}" ${cur === o.v ? "checked" : ""} required />
        <span>${o.l}</span>
      </label>
    `).join("");
  };
  fillRadios("prefAGroup", "prefA", t.prefAOpts, snap.prefA);
  fillRadios("prefBGroup", "prefB", t.prefBOpts, snap.prefB);
  fillRadios("prefCGroup", "prefC", t.prefCOpts, snap.prefC);

  // Open questions F1-F6
  const openHost = document.getElementById("openContainer");
  openHost.innerHTML = t.openQs.map((q) => `
    <div class="field">
      <label class="field-label" for="${q.id}">${q.label}</label>
      <textarea id="${q.id}" name="${q.id}" placeholder="${q.ph}">${(snap[q.id] || "").replace(/</g, "&lt;")}</textarea>
    </div>
  `).join("");

  // Restore top-level fields if restoring draft
  if (restoreData) {
    document.getElementById("consent").checked = Boolean(restoreData.consent);
    document.getElementById("pid").value = restoreData.pid || "";
    document.getElementById("years").value = restoreData.years || "";
    document.getElementById("role").value = restoreData.role || "";
    document.getElementById("device").value = restoreData.device || "";
    document.getElementById("prefAReason").value = restoreData.prefAReason || "";
  }
}

function collectFormData() {
  const form = document.getElementById("surveyForm");
  const getVal = (id) => (document.getElementById(id)?.value || "").trim();
  const getRadio = (name) => form.querySelector(`input[name="${name}"]:checked`)?.value || "";
  const daws = Array.from(form.querySelectorAll('input[name="daws"]:checked')).map((el) => el.value);

  const out = {
    timestamp: new Date().toISOString(),
    ui_lang: currentLang,
    layout_mode: SURVEY_LAYOUT_MODE,
    consent: document.getElementById("consent")?.checked || false,
    pid: getVal("pid"),
    years: getVal("years"),
    role: getVal("role"),
    daws,
    middleware: getVal("middleware"),
    oddMeterExp: getVal("oddMeterExp"),
    device: getVal("device"),
    prefA: getRadio("prefA"),
    prefAReason: getVal("prefAReason"),
    prefB: getRadio("prefB"),
    prefC: getRadio("prefC"),
  };
  for (const q of I18N.en.likert) out[q.id] = getRadio(q.id);
  for (const q of I18N.en.openQs) out[q.id] = getVal(q.id);
  return out;
}

function validateForm(data) {
  const t = I18N[currentLang];
  document.querySelectorAll(".likert-item.missing").forEach((el) => el.classList.remove("missing"));
  if (!data.consent) { showToast(t.errConsent, false); return false; }

  let ok = true;
  if (!data.pid || !data.years || !data.role || !data.middleware || !data.oddMeterExp || !data.prefA || !data.prefB || !data.prefC) {
    ok = false;
  }
  for (const q of I18N.en.likert) {
    if (!data[q.id]) {
      ok = false;
      document.querySelector(`.likert-item[data-qid="${q.id}"]`)?.classList.add("missing");
    }
  }
  if (!ok) {
    showToast(t.errRequired, false);
    const firstMissing = document.querySelector(".likert-item.missing") || document.querySelector(":invalid");
    firstMissing?.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  return ok;
}

function showToast(msg, ok) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast " + (ok ? "ok" : "err");
}

function toCsv(data) {
  const cols = [
    "timestamp", "ui_lang", "layout_mode", "pid", "years", "role", "daws", "middleware", "oddMeterExp", "device",
    ...I18N.en.likert.map((q) => q.id),
    "prefA", "prefAReason", "prefB", "prefC",
    ...I18N.en.openQs.map((q) => q.id)
  ];
  const esc = (v) => {
    const s = Array.isArray(v) ? v.join(";") : String(v ?? "");
    return `"${s.replace(/"/g, '""').replace(/\r?\n/g, " \\n ")}"`;
  };
  return "\uFEFF" + cols.join(",") + "\n" + cols.map((c) => esc(data[c])).join(",") + "\n";
}

function toReadableSummary(data) {
  const lines = [
    `=== SeamWeaver User Study Response (${data.pid || "Anonymous"}) ===`,
    `Time: ${data.timestamp} | Lang: ${data.ui_lang}`,
    `Background: ${data.role} | Exp: ${data.years} yrs | DAWs: ${(data.daws || []).join(", ")}`,
    `Middleware(1-3): ${data.middleware} | OddMeter(1-3): ${data.oddMeterExp} | Device: ${data.device}`,
    `--- Likert (1-7) ---`,
    ...I18N.en.likert.map((q) => `${q.code} (${q.id}): ${data[q.id]}`),
    `--- Preferences ---`,
    `PrefA (H3 Barline): ${data.prefA} ${data.prefAReason ? `| Reason: ${data.prefAReason}` : ""}`,
    `PrefB (Tempo): ${data.prefB} | PrefC (View): ${data.prefC}`,
    `--- Open Feedback ---`,
    ...I18N.en.openQs.map((q) => `${q.id}: ${data[q.id] || "(empty)"}`)
  ];
  return lines.join("\n");
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function postWebhookIfConfigured(data) {
  if (!OPTIONAL_WEBHOOK_URL) return;
  try {
    await fetch(OPTIONAL_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
  } catch { /* silent fallback to local download */ }
}

// Embed & layout query params + parent postMessage sync
const URL_PARAMS = new URLSearchParams(window.location.search);
const IS_EMBED = URL_PARAMS.get("embed") === "1";
const SURVEY_LAYOUT_MODE = URL_PARAMS.get("layout") || (IS_EMBED ? "split" : "standalone");
if (IS_EMBED) {
  document.body.classList.add("embed-mode");
}

// Init
const draft = loadDraft();
const urlLang = URL_PARAMS.get("lang");
const initLang = (urlLang && I18N[urlLang]) ? urlLang : (draft?.lang || "zh");
renderForm(initLang, draft?.data || null);

window.addEventListener("message", (ev) => {
  if (ev.origin !== window.location.origin) return;
  const msg = ev.data;
  if (msg && msg.type === "seamweaver:set-lang" && I18N[msg.lang] && msg.lang !== currentLang) {
    saveDraft();
    renderForm(msg.lang);
    saveDraft();
  }
});

window.addEventListener("storage", (ev) => {
  if (ev.key === STORAGE_KEY) {
    const fresh = loadDraft();
    if (fresh && fresh.data) {
      renderForm(fresh.lang || currentLang, fresh.data);
    }
  }
});

document.querySelectorAll(".lang-bar button").forEach((btn) => {
  btn.addEventListener("click", () => {
    saveDraft();
    renderForm(btn.dataset.lang);
    saveDraft();
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "seamweaver:survey-lang", lang: btn.dataset.lang }, window.location.origin);
    }
  });
});

document.getElementById("surveyForm").addEventListener("input", saveDraft);
document.getElementById("surveyForm").addEventListener("change", saveDraft);

document.getElementById("surveyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = collectFormData();
  if (!validateForm(data)) return;
  const safeId = (data.pid || "anon").replace(/[^a-zA-Z0-9_-]/g, "_");
  const stamp = new Date().toISOString().slice(0, 10);
  downloadBlob(toCsv(data), `seamweaver_survey_${safeId}_${stamp}.csv`, "text/csv;charset=utf-8");
  await postWebhookIfConfigured(data);
  const box = document.getElementById("previewBox");
  box.style.display = "block";
  box.textContent = toReadableSummary(data);
  showToast(I18N[currentLang].okCsv, true);
});

document.getElementById("btnCopy").addEventListener("click", async () => {
  const data = collectFormData();
  if (!validateForm(data)) return;
  const text = toReadableSummary(data);
  try {
    await navigator.clipboard.writeText(text);
    showToast(I18N[currentLang].okCopy, true);
  } catch {
    showToast(I18N[currentLang].okCopy, true);
  }
  const box = document.getElementById("previewBox");
  box.style.display = "block";
  box.textContent = text;
});

document.getElementById("btnDownloadJson").addEventListener("click", () => {
  const data = collectFormData();
  if (!validateForm(data)) return;
  const safeId = (data.pid || "anon").replace(/[^a-zA-Z0-9_-]/g, "_");
  const stamp = new Date().toISOString().slice(0, 10);
  downloadBlob(JSON.stringify(data, null, 2), `seamweaver_survey_${safeId}_${stamp}.json`, "application/json");
  showToast(I18N[currentLang].okJson, true);
});

document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm(I18N[currentLang].confirmReset)) return;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById("surveyForm").reset();
  renderForm(currentLang, {});
  document.getElementById("previewBox").style.display = "none";
  document.getElementById("toast").className = "toast";
});
</script>
</body>
</html>
